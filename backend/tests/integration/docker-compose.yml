services:
  mongo-integration:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    ports:
      - "127.0.0.1:27019:27019"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --port 27019 --eval
          'try { rs.status().ok } catch (e) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27019"}]}).ok
          }'
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"
